name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GangOfFour.slnx

      - name: Build
        run: dotnet build GangOfFour.slnx --no-restore -c Release

      - name: Test
        run: dotnet test GangOfFour.slnx --no-build -c Release

      - name: Verify pattern diffs
        shell: pwsh
        run: |
          $categories = Get-ChildItem -LiteralPath patterns -Directory
          foreach ($categoryDirectory in $categories) {
            $patternDirectories = Get-ChildItem -LiteralPath $categoryDirectory.FullName -Directory
            foreach ($patternDirectory in $patternDirectories) {
              $solution = Get-ChildItem -LiteralPath $patternDirectory.FullName -Filter '*.slnx' -File | Select-Object -First 1
              if ($null -eq $solution) {
                continue
              }

              & ./tools/diff-baseline.ps1 -Category $categoryDirectory.Name -Name $patternDirectory.Name
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
          }

          git diff --exit-code -- patterns
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
