name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GangOfFour.slnx

      - name: Build
        run: dotnet build GangOfFour.slnx --no-restore -c Release

      - name: Test
        run: dotnet test GangOfFour.slnx --no-build -c Release
